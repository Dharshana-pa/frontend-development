<!DOCTYPE html>
<html>
<head>
    <title>Login - VerseCollab</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #f5e6cc;
            font-family: serif;
        }

        .box {
            max-width: 400px;
            margin: 80px auto;
            background: #fff8e7;
            padding: 30px;
            border-radius: 10px;
        }
    </style>
</head>

<body>

<div class="box">

    <h3 class="text-center">🔐 VerseCollab Login</h3>

    <input type="text" id="username" class="form-control mt-3" placeholder="Username">

    <input type="password" id="password" class="form-control mt-3" placeholder="Password">

    <button class="btn btn-dark w-100 mt-3" onclick="login()">Login</button>

    <button class="btn btn-secondary w-100 mt-2" onclick="register()">Register</button>

    <p id="msg" class="mt-2 text-center"></p>

</div>

<script>
function register() {
    let user = document.getElementById("username").value;
    let pass = document.getElementById("password").value;

    if(user === "" || pass === "") {
        alert("Fill all fields!");
        return;
    }

    let users = JSON.parse(localStorage.getItem("users")) || {};

    if(users[user]) {
        document.getElementById("msg").innerText = "User already exists!";
        return;
    }

    users[user] = pass;
    localStorage.setItem("users", JSON.stringify(users));

    document.getElementById("msg").innerText = "Registered! Now login ✨";
}

function login() {
    let user = document.getElementById("username").value;
    let pass = document.getElementById("password").value;

    let users = JSON.parse(localStorage.getItem("users")) || {};

    if(users[user] && users[user] === pass) {
        localStorage.setItem("currentUser", user);
        window.location.href = "index.html";
    } else {
        document.getElementById("msg").innerText = "Invalid login!";
    }
}
</script>

</body>
</html>
