<!DOCTYPE html>
<html lang="en">
<head>
  
    <title>VerseCollab</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display&family=Cormorant+Garamond&display=swap" rel="stylesheet">

    <style>
        body {

            background: #f5e6cc url('https://www.transparenttextures.com/patterns/paper.png');
            font-family: 'Cormorant Garamond', serif;
            color: #3e2f1c;
        }

        .navbar { background-color: #8b5e3c; }
        .navbar a { color: white !important; }

        .hero { text-align: center; padding: 100px 20px; }

        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 4rem;
        }

        .btn-custom {
            background-color: #6e462b;
            color: white;
            border-radius: 30px;
            padding: 10px 25px;
            margin: 10px;
        }

        .typewriter {
            overflow: hidden;
            border-right: .15em solid brown;
            white-space: nowrap;
            animation: typing 3s steps(30), blink .75s infinite;
            width: 0;
        }

        @keyframes typing { from { width: 0 } to { width: 100% } }
        @keyframes blink { 50% { border-color: transparent } }
    </style>
</head>

<body>

<nav class="navbar p-3">
    <div class="container">
        <span class="navbar-brand text-white">📜 VerseCollab</span>
        <div>

            <a href="explore.html">Explore</a>
        </div>
    </div>
</nav>

<div class="hero">
<img src="logo.png.png" width="200">
    <h1>VerseCollab</h1>
    <p class="typewriter">Where words are written together.</p>

    <br>
    <a href="login.html" class="btn btn-custom">COME LETS JOIN TOGETHER</a>
    <a href="create.html" class="btn btn-custom"> START WRITING</a>
    <a href="collab.html" class="btn btn-custom">JOIN A VERSE</a>
</div>

</body>
</html>
