<!DOCTYPE html>
<html>
<head>
    <title>Create Verse</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #f5e6cc;
            font-family: serif;
        }

        .box {
            background: #fff8e7;
            padding: 30px;
            margin-top: 50px;
            border-radius: 10px;
        }

        .card {
            margin-top: 15px;
            background: #fff8e7;
        }
    </style>
</head>

<body>

<div class="container">
    <div class="box">
        <h2>✍️ Start Your Verse</h2>

        <textarea id="verseInput" class="form-control" rows="4" placeholder="Write something timeless..."></textarea>

        <br>

        <button class="btn btn-dark" onclick="addVerse()">Submit</button>

        <p id="msg" style="color: green;"></p>
    </div>

    <h3 class="mt-4">📜 Your Verses</h3>
    <div id="verseList"></div>
</div>

<script>
function addVerse() {
    let text = document.getElementById("verseInput").value;

    if(text.trim() === "") {
        alert("Write something first!");
        return;
    }

    let verses = JSON.parse(localStorage.getItem("verses")) || [];

    verses.push(text);
    localStorage.setItem("verses", JSON.stringify(verses));

    document.getElementById("msg").innerText = "Saved ✨";
    document.getElementById("verseInput").value = "";

    showVerses();
}

function showVerses() {
    let verses = JSON.parse(localStorage.getItem("verses")) || [];
    let container = document.getElementById("verseList");

    container.innerHTML = "";

    verses.forEach(v => {
        let div = document.createElement("div");
        div.className = "card p-3";
        div.innerText = v;
        container.appendChild(div);
    });
}

showVerses();
</script>

</body>
</html>
